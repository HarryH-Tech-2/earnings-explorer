<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Orb glow -->
  <circle cx="32" cy="30" r="22" fill="url(#glow)"/>
  <!-- Company color orbs -->
  <circle cx="22" cy="24" r="5" fill="#6366f1" opacity="0.85"/>
  <circle cx="42" cy="24" r="5" fill="#22c55e" opacity="0.85"/>
  <circle cx="22" cy="38" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="42" cy="38" r="5" fill="#ec4899" opacity="0.85"/>
  <!-- Center beacon -->
  <circle cx="32" cy="31" r="6" fill="#fff" opacity="0.9"/>
  <circle cx="32" cy="31" r="3" fill="#fbbf24"/>
  <!-- Light pillar -->
  <rect x="30" y="6" width="4" height="18" rx="2" fill="#fbbf24" opacity="0.35"/>
  <!-- Text hint -->
  <text x="32" y="56" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="9" fill="#fff" opacity="0.8">EE</text>
</svg>
